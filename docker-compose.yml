services:
  # Owns the network namespace + the single public port.
  # `web` joins this netns and listens on :8080; MCP/API stay on :8765/:8766 (localhost).
  mcp:
    image: bobdivx/zimatools-mcp:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    container_name: zimatools-mcp
    restart: always
    ports:
      - "8484:8080"
    env_file:
      - path: .env
        required: false
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8765"
      MCP_ENDPOINT: /mcp
      MCP_CORS_ORIGIN: "*"
      API_PORT: "8766"
      API_CORS_ORIGIN: "*"
      ZIMAOS_API_BASE: ${ZIMAOS_API_BASE:-http://127.0.0.1}
      ZIMAOS_API_TOKEN: ${ZIMAOS_API_TOKEN:-}
      ZIMAOS_SSH_PASSWORD: ${ZIMAOS_SSH_PASSWORD:-}
      IMAGE_WEBHOOK_SECRET: ${IMAGE_WEBHOOK_SECRET:-}
      ZIMATOOLS_DATA_DIR: /data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - zimatools-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8766/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    image: bobdivx/zimatools-web:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: zimatools-web
    restart: always
    network_mode: "service:mcp"
    depends_on:
      - mcp
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      API_UPSTREAM: http://127.0.0.1:8766
      MCP_UPSTREAM: http://127.0.0.1:8765

x-casaos:
  hostname: ""
  index: /
  is_uncontrolled: false
  main: mcp
  port_map: "8484"
  scheme: http
  title:
    custom: ZimaTools

volumes:
  zimatools-data:

# GPU NVIDIA: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
